apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: k3d-dgreg:5000/demo@sha256:42dbf5ca3c56191eb129b2e3c58678fef6fb7759a2ba01c86c44d7cb2b035cf7
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: apps
spec:
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 8080
