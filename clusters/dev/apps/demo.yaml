apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: k3d-dgreg:5000/demo@sha256:85d3b500bf5a4f2a6fed9cdedf9fdbbb82020ed2bee076dc70e2988e6e73d7ba
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: apps
spec:
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 8080
